name: Publish

on:
  push:
    branches: [main]

jobs:
  publish:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck container
        run: pnpm --filter @digest/container typecheck

      - name: Build
        run: pnpm build

      - name: Test (host)
        run: pnpm test

      - name: Test (container)
        run: pnpm --filter @digest/container test

      - name: Bump patch version
        working-directory: packages/digest
        run: npm version patch --no-git-tag-version

      - name: Commit and push version bump
        run: |
          VERSION=$(node -p "require('./packages/digest/package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/digest/package.json
          git commit -m "chore: bump version to ${VERSION} [skip ci]"
          git pull --rebase
          git push

      - name: Publish to npm
        working-directory: packages/digest
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
